# 近畿6府県の気象警報・注意報（気象庁のJSON）を10分ごとに見て、変わったときだけ保存する。
# GitHub の定期実行は混んでいると遅れたり飛んだりする。止めたいときは Actions タブで Disable にする。
name: collect-warning

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write # data/warning/ のコミット

concurrency:
  group: collect-warning
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: パッケージを入れる
        run: pip install -r requirements.txt

      - name: 警報を見る
        run: python scripts/collect_warning.py

      - name: 変わっていればコミット
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/warning
          if git diff --cached --quiet; then
            echo "変化なし"
            exit 0
          fi
          git commit -m "警報を更新 $(TZ=Asia/Tokyo date +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1
